# Signing key used to build installable (sideloaded) release APKs.
# It is deliberately committed so that every build is signed with the same
# key and updates install over previous versions. Generate your own key and
# keep it private before publishing the app on a store.
storeFile=frameloom-release.jks
storePassword=frameloom-sideload
keyAlias=frameloom
keyPassword=frameloom-sideload
